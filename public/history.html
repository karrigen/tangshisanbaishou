<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>更新历史 · 唐诗三百首</title>
  <style>
    :root {
      --ink: #1b2027;
      --paper: #f2ede1;
      --seal: #c9a227;
      --seal-dim: rgba(201, 162, 39, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px 80px;
      min-height: 100vh;
      background: #0b0d10;
      color: var(--paper);
      font-family: "Kaiti SC", "STKaiti", "楷体", serif;
    }
    .page {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 6px;
      letter-spacing: 0.05em;
    }
    .subtitle {
      color: #a89f8e;
      font-size: 0.9rem;
      margin-bottom: 40px;
    }
    .timeline {
      position: relative;
      padding-left: 24px;
      border-left: 1px solid var(--seal-dim);
    }
    .entry {
      position: relative;
      margin-bottom: 32px;
    }
    .entry::before {
      content: "";
      position: absolute;
      left: -29px;
      top: 4px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--seal);
      box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.2);
    }
    .entry .date {
      font-size: 0.8rem;
      color: var(--seal);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .entry .desc {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--paper);
    }
    a.back {
      display: inline-block;
      margin-bottom: 30px;
      color: #a89f8e;
      text-decoration: none;
      font-size: 0.85rem;
    }
    a.back:hover { color: var(--paper); }
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="/">← 返回诗画卷</a>
    <h1>更新历史</h1>
    <div class="subtitle">记录这个小网站的每一次改动</div>

    <div class="timeline" id="timeline"></div>
  </div>

  <script>
    // 每次改动直接在这个数组里加一条新记录即可，最新的写在最前面
    const history = [
      {
        date: "2026-08-31",
        desc: "增加点赞，历史，朗读"
      },
      {
        date: "2026-08-29",
        desc: "建立"
      }
    ];

    const timeline = document.getElementById('timeline');
    history.forEach((item) => {
      const el = document.createElement('div');
      el.className = 'entry';
      el.innerHTML =
        '<div class="date">' + item.date + '</div>' +
        '<div class="desc">' + item.desc + '</div>';
      timeline.appendChild(el);
    });
  </script>
</body>
</html>
